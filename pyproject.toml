[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src/"]
include = ["amsterdamnlp.pcfgrammar"]

[project]
name = "amsterdamnlp-pcfgrammar"
version = "0.0.1"
authors = [
  { name="Jaap Jumelet", email="jumeletjaap@gmail.com" },
  { name="Martijn van Beers", email="mail_dev@martijn.at" },
]

dependencies = [
    'transformers',
    'tokenizers',
    'xlstm',
]

description = "accompanying package for 'Transparency at the Source` project"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/pypa/sampleproject"
Issues = "https://github.com/pypa/sampleproject/issues"
